[project]
name = "phofilesystemiconhelper"
version = "0.1.0"
description = "Helps set and manage custom filesystem (file/folder) icons on Windows"
requires-python = ">=3.9"
dependencies = [
    "cadquery>=2.5.2",
    "ipython>=8.11.0",
    "pillow>=11.3.0",
    "pyqt6>=6.4.2",
    "wheel>=0.40.0",
]
authors = [{ name = "Pho Hale", email = "PhoHale@gmail.com" }]

[dependency-groups]
dev = [
    "dvc>=2.48.0",
    "setuptools>=67.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phofilesystemiconhelper"]

